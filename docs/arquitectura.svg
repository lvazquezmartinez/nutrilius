<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'Plus Jakarta Sans', system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="760" fill="#ffffff"/>
  <text x="490" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1E4D6B">Diagrama de arquitectura — Nutrilius</text>
  <text x="490" y="62" text-anchor="middle" font-size="13" fill="#64748b">Prototipo SaaS multi-tenant · GCP serverless</text>

  <!-- Límite GCP -->
  <rect x="224" y="88" width="720" height="536" rx="14" fill="#F5F9FB" stroke="#1E4D6B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="244" y="112" font-size="13" font-weight="700" fill="#1E4D6B">☁ Google Cloud Platform</text>

  <!-- Usuario -->
  <rect x="28" y="332" width="156" height="70" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="106" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Navegador web</text>
  <text x="106" y="381" text-anchor="middle" font-size="11.5" fill="#6B7280">Nutricionista / staff</text>

  <!-- Cloud DNS -->
  <rect x="250" y="120" width="188" height="58" rx="10" fill="#ffffff" stroke="#1E4D6B" stroke-width="1.3"/>
  <text x="344" y="145" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E4D6B">Cloud DNS</text>
  <text x="344" y="163" text-anchor="middle" font-size="11.5" fill="#64748b">nutrilius.com.ar</text>

  <!-- Load Balancer + CDN -->
  <rect x="250" y="330" width="188" height="72" rx="10" fill="#E6F4EC" stroke="#3DAA7F" stroke-width="1.6"/>
  <text x="344" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f5e46">HTTPS Load Balancer</text>
  <text x="344" y="377" text-anchor="middle" font-size="12" fill="#2f7d5c">+ Cloud CDN (SSL)</text>

  <!-- Frontend bucket -->
  <rect x="486" y="150" width="196" height="70" rx="10" fill="#E6F4EC" stroke="#3DAA7F" stroke-width="1.6"/>
  <text x="584" y="180" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f5e46">Cloud Storage</text>
  <text x="584" y="199" text-anchor="middle" font-size="11.5" fill="#2f7d5c">Frontend SPA (React)</text>

  <!-- Cloud Run -->
  <rect x="486" y="360" width="196" height="72" rx="10" fill="#D7E6EE" stroke="#1E4D6B" stroke-width="2"/>
  <text x="584" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#1E4D6B">Cloud Run</text>
  <text x="584" y="408" text-anchor="middle" font-size="11.5" fill="#345f75">API — Django + DRF</text>

  <!-- Cloud SQL -->
  <rect x="742" y="150" width="184" height="60" rx="10" fill="#EAF2F6" stroke="#1E4D6B" stroke-width="1.4"/>
  <text x="834" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E4D6B">Cloud SQL</text>
  <text x="834" y="193" text-anchor="middle" font-size="11.5" fill="#64748b">PostgreSQL 16</text>

  <!-- Secret Manager -->
  <rect x="742" y="252" width="184" height="56" rx="10" fill="#EAF2F6" stroke="#1E4D6B" stroke-width="1.4"/>
  <text x="834" y="276" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E4D6B">Secret Manager</text>
  <text x="834" y="293" text-anchor="middle" font-size="11.5" fill="#64748b">secretos / credenciales</text>

  <!-- Cloud Tasks -->
  <rect x="742" y="350" width="184" height="56" rx="10" fill="#EAF2F6" stroke="#1E4D6B" stroke-width="1.4"/>
  <text x="834" y="374" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E4D6B">Cloud Tasks</text>
  <text x="834" y="391" text-anchor="middle" font-size="11.5" fill="#64748b">tareas asíncronas</text>

  <!-- Cloud Storage media -->
  <rect x="742" y="448" width="184" height="56" rx="10" fill="#EAF2F6" stroke="#1E4D6B" stroke-width="1.4"/>
  <text x="834" y="472" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E4D6B">Cloud Storage</text>
  <text x="834" y="489" text-anchor="middle" font-size="11.5" fill="#64748b">archivos / PDFs</text>

  <!-- SMTP externo (fuera del limite) -->
  <rect x="486" y="656" width="196" height="64" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <text x="584" y="682" text-anchor="middle" font-size="13.5" font-weight="700" fill="#374151">SMTP externo</text>
  <text x="584" y="700" text-anchor="middle" font-size="11.5" fill="#6B7280">envialosimple (correo)</text>

  <!-- Flechas -->
  <!-- Usuario -> LB -->
  <line x1="184" y1="366" x2="248" y2="366" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="216" y="357" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">HTTPS</text>
  <!-- DNS ..> LB (resolucion) -->
  <line x1="344" y1="178" x2="344" y2="328" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrowDash)"/>
  <text x="352" y="256" font-size="10.5" fill="#94a3b8">resuelve dominio</text>
  <!-- LB -> Frontend (/) -->
  <path d="M438,352 C462,320 462,220 484,192" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">/ (estático)</text>
  <!-- LB -> Cloud Run (/api) -->
  <path d="M438,380 C460,388 462,392 484,394" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="462" y="405" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">/api</text>
  <!-- Cloud Run -> Cloud SQL -->
  <path d="M682,378 C712,340 716,220 740,196" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="726" y="300" text-anchor="middle" font-size="10.5" fill="#475569">consultas SQL</text>
  <!-- Cloud Run -> Secret -->
  <line x1="682" y1="388" x2="740" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Cloud Run -> Tasks -->
  <line x1="682" y1="398" x2="740" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Cloud Run -> Media -->
  <path d="M682,414 C712,450 716,470 740,476" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Cloud Run -> SMTP -->
  <line x1="584" y1="432" x2="584" y2="654" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="592" y="560" font-size="10.5" fill="#475569">correo (SMTP)</text>

  <!-- Nota WIF/Terraform -->
  <text x="244" y="608" font-size="10.5" fill="#94a3b8">Aprovisionamiento: Terraform · CI/CD: GitHub Actions (Workload Identity Federation)</text>
</svg>
