name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*.*.*']        # release-driven: un tag SemVer dispara el deploy versionado
  pull_request:
    branches: [main]

jobs:
  # ─── Detecta si hay que correr (backend cambiado o release por tag) ──
  # Reemplaza al filtro `paths:` del trigger, que no es confiable para tags.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: d
        name: ¿Correr el pipeline?
        run: |
          # Los tags (releases) siempre corren.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BEFORE="${{ github.event.before }}"
          # Primer push / evento sin base conocida → correr por las dudas.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Push a rama: solo si tocó backend/ o el propio workflow.
          if git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -qE '^(backend/|\.github/workflows/ci-cd\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Validaciones + tests (runner gratis de GitHub) ──────
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nutrilius
          POSTGRES_USER: nutrilius_user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nutrilius_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-secret-key-not-used-in-prod
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: nutrilius
      POSTGRES_USER: nutrilius_user
      POSTGRES_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Validar que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (pytest)
        run: pytest

  # ─── Build + push a Artifact Registry + deploy a Cloud Run ─
  # Corre en push a main (imagen :sha) y en tags v*.*.* (imagen :version + :latest).
  build-deploy:
    needs: [changes, test]
    if: needs.changes.outputs.run == 'true' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment: main # las Variables (GCP_*, WIF_PROVIDER, ...) viven en este environment

    permissions:
      contents: read
      id-token: write # necesario para Workload Identity Federation

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticación a GCP (sin llaves)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build & push de la imagen
        run: |
          BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}/backend"
          # En tags usamos la versión (v0.2.0); en push a main, el SHA.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.sha }}"
          fi
          IMAGE="$BASE:$VERSION"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          # En releases marcamos además :latest para saber cuál es la última versión estable.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            docker tag "$IMAGE" "$BASE:latest"
            docker push "$BASE:latest"
          fi
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Migraciones (Cloud Run job)
        run: |
          gcloud run jobs update ${{ vars.MIGRATE_JOB }} \
            --image "$IMAGE" --region ${{ vars.GCP_REGION }} --quiet
          gcloud run jobs execute ${{ vars.MIGRATE_JOB }} \
            --region ${{ vars.GCP_REGION }} --wait

      - name: Deploy a Cloud Run
        run: |
          gcloud run deploy ${{ vars.RUN_SERVICE }} \
            --image "$IMAGE" --region ${{ vars.GCP_REGION }} --quiet
