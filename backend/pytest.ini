[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
# --ds fuerza el settings de test aunque el contenedor exporte DJANGO_SETTINGS_MODULE=dev
# (docker-compose lo setea para runserver). Así los tests nunca usan la config de dev
# ni llaman a la API real de IA.
addopts = -q --reuse-db --ds=config.settings.test
