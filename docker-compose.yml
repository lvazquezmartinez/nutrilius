version: "3.9"

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nutrilius
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    image: lichori/nutrilius-backend:latest
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: nutrilius
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: change-me-super-secret-32chars-minimum
      APP_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    image: lichori/nutrilius-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
